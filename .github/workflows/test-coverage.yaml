# This workflow comes from the examples in https://github.com/r-lib/actions/tree/v2/examples
# For help with build failures, see https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        # The upload uses the repository secret `CODECOV_TOKEN`. Codecov limits
        # the rate of anonymous uploads and can discard them. Add the token in
        # Settings > Secrets > Actions.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: covr::codecov(quiet = FALSE)
        shell: Rscript {0}
