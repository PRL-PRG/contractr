# Runs the mutation tests of mutator with the reusable workflow of PRL-PRG/mutator.
# The section "Continuous integration" of the mutator README gives all inputs.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: mutation-testing

jobs:
  mutation-testing:
    uses: PRL-PRG/mutator/.github/workflows/mutation-testing.yaml@main
    # `contents: write` lets the reusable workflow write the badge JSON to gh-pages.
    permissions:
      contents: write
    with:
      target-margin: "0.10"
      # Writes `mutation-results/mutation-score.json` to the gh-pages branch for
      # a shields.io badge. A pull_request run does not do this step.
      deploy-badge: true
